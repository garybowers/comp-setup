general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/hypr/dpms-resume.sh
}

listener {
    timeout = 300 
    on-timeout = loginctl lock-session
}

# dpms is toggle-only on this Hyprland (see dpms.sh) — never call it blind.
listener {
    timeout = 600
    on-timeout = ~/.config/hypr/dpms.sh off
    on-resume = ~/.config/hypr/dpms.sh on
}

# Suspend on idle. A host with a hosts/<hostname>.no-suspend marker file is
# skipped (e.g. gary-desktop, which must stay reachable remotely), so this
# file is the same on every machine.
#Battery: suspend only when NOT on AC power
listener {
    timeout = 1000
    on-timeout = [ -e ~/.config/hypr/hosts/$(cat /etc/hostname).no-suspend ] || systemd-ac-power || systemctl suspend
}

#AC Power: suspend only when on AC power
listener {
    timeout = 1800
    on-timeout = [ -e ~/.config/hypr/hosts/$(cat /etc/hostname).no-suspend ] || (systemd-ac-power && systemctl suspend)
}
