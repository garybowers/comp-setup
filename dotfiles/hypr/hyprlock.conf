# Colours ($text, $dim, $accent, $fail) come from the active theme:
# hyprlock-theme.conf is a symlink maintained by ~/.config/themes/set-theme.sh.
source = ~/.config/hypr/hyprlock-theme.conf

general {
  hide_cursor = true
}

animations {
  enabled = true
  bezier = linear, 1, 1, 0, 0
  animation = fadeIn, 1, 5, linear
  animation = fadeOut, 1, 5, linear
  animation = inputFieldDots, 1, 2, linear
}

background {
  monitor =
  # symlink maintained by ~/.config/themes/set-theme.sh (tracks the active theme)
  path = /home/gary/.config/hypr/current-wallpaper
  blur_passes = 2
}

input-field {
  monitor =
  size = 20%, 5%
  outline_thickness = 2
  dots_size = 0.3
  dots_spacing = 0.35
  dots_center = true
  outer_color = rgba(0, 0, 0, 0)
  inner_color = rgba(0, 0, 0, 0.2)
  font_color = $text
  check_color = $accent
  fail_color = $fail
  rounding = 50 
  halign = center
  valign = center
}

# Clock
label {
  monitor =
  text = $TIME
  color = $text
  font_size = 96
  font_family = Fira Sans
  position = 0, 260
  halign = center
  valign = center
}

# Date, e.g. "Monday 16 November"
label {
  monitor =
  text = cmd[update:60000] date +"%A %-d %B"
  color = $dim
  font_size = 24
  font_family = Fira Sans
  position = 0, 150
  halign = center
  valign = center
}
